<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>

    /* 主色由主窗口广播（aux:accent），未收到时默认商务蓝 */
    :root {
      --l-primary: #165DFF; --l-primary-hover: #0E42D2;
      --d-primary: #4080FF; --d-primary-hover: #5A8CFF;
    }
    html[data-accent='polar'] { --l-primary: #165DFF; --l-primary-hover: #0E42D2; --d-primary: #4080FF; --d-primary-hover: #5A8CFF; }
    html[data-accent='mist'] { --l-primary: #3D6FE0; --l-primary-hover: #2E58BE; --d-primary: #6E9BFF; --d-primary-hover: #8AB0FF; }
    html[data-accent='jade'] { --l-primary: #0B8650; --l-primary-hover: #096E42; --d-primary: #3DD68C; --d-primary-hover: #62E0A4; }
    html[data-accent='violet'] { --l-primary: #7C4DFF; --l-primary-hover: #6633E6; --d-primary: #A78BFA; --d-primary-hover: #BCA3FB; }
    html[data-accent='rose'] { --l-primary: #E0457B; --l-primary-hover: #C22E63; --d-primary: #FF7EB3; --d-primary-hover: #FF9AC4; }
    html[data-accent='gold'] { --l-primary: #9A6E00; --l-primary-hover: #805A00; --d-primary: #F0C040; --d-primary-hover: #F7CE62; }
    html[data-accent='teal'] { --l-primary: #00938F; --l-primary-hover: #007A77; --d-primary: #2FD8D8; --d-primary-hover: #58E2E2; }
    html[data-accent='sand'] { --l-primary: #C2612F; --l-primary-hover: #A45125; --d-primary: #E8885C; --d-primary-hover: #F0A17D; }
    html[data-accent='mono'] { --l-primary: #2B2B2D; --l-primary-hover: #1A1A1C; --d-primary: #C9C9CE; --d-primary-hover: #DCDCE0; }
    /* 辅助窗口都是浅底浮层，统一用浅色主色 */
    :root { --aux-primary: var(--l-primary); --aux-primary-hover: var(--l-primary-hover); --aux-on: #fff; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    #bar { position: relative; width: 100vw; height: 100vh; cursor: move; }
    canvas { display: block; }
    #ctrl {
      position: fixed; right: 4px; bottom: 4px; display: flex; gap: 4px;
    }
    #ctrl div {
      width: 18px; height: 18px; border-radius: 4px; background: color-mix(in srgb, var(--aux-primary) 85%, transparent); color: var(--aux-on);
      font-size: 11px; line-height: 18px; text-align: center; cursor: pointer; font-family: sans-serif;
    }
    #tip { position: fixed; background: color-mix(in srgb, var(--aux-primary) 90%, transparent); color: var(--aux-on); font: 11px Consolas, monospace; padding: 1px 6px; border-radius: 3px; pointer-events: none; display: none; white-space: nowrap; }
  </style>
  <script>
  // 跟随主窗口的配色主题
  (function () {
    var ids = ['polar','mist','jade','violet','rose','gold','teal','sand','mono'];
    function apply(id) { if (ids.indexOf(id) !== -1) document.documentElement.dataset.accent = id; }
    try {
      var q = new URLSearchParams(location.search).get('accent');
      if (q) apply(q);
    } catch (e) {}
    if (window.hehe && window.hehe.on) {
      try { window.hehe.on('aux:accent', apply); } catch (e) {}
    }
  })();
</script>

</head>
<body>
  <div id="bar"><canvas id="c"></canvas></div>
  <div id="ctrl"><div id="toggle" title="横竖切换">⇄</div><div id="close" title="关闭(或双击标尺 / Esc)">✕</div></div>
  <div id="tip"></div>
  <script>
    const params = new URLSearchParams(location.search);
    let dir = params.get('dir') === 'v' ? 'v' : 'h';
    const canvas = document.getElementById('c');
    const tip = document.getElementById('tip');

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      // translucent track
      ctx.fillStyle = 'rgba(15,23,42,0.82)';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '10px Consolas, monospace';
      ctx.lineWidth = 1;
      const major = 100, mid = 50, minor = 10;
      if (dir === 'h') {
        ctx.beginPath(); ctx.moveTo(0, h - 6); ctx.lineTo(w, h - 6); ctx.stroke();
        for (let x = 0; x <= w; x += minor) {
          const len = x % major === 0 ? 14 : x % mid === 0 ? 9 : 5;
          ctx.beginPath(); ctx.moveTo(x, h - 6); ctx.lineTo(x, h - 6 - len); ctx.stroke();
          if (x % major === 0 && x > 0) ctx.fillText(String(x), x + 2, h - 22);
        }
      } else {
        ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(6, h); ctx.stroke();
        for (let y = 0; y <= h; y += minor) {
          const len = y % major === 0 ? 14 : y % mid === 0 ? 9 : 5;
          ctx.beginPath(); ctx.moveTo(6, y); ctx.lineTo(6 + len, y); ctx.stroke();
          if (y % major === 0 && y > 0) {
            ctx.save(); ctx.translate(16, y - 2); ctx.rotate(-Math.PI / 2);
            ctx.fillText(String(y), 0, 8); ctx.restore();
          }
        }
      }
      window.__drawn = true;
    }

    // 整个标尺都是拖动区，而 Electron 的 -webkit-app-region: drag 会吞掉鼠标事件，
    // 所以这里用 IPC 手动拖动，mousemove / dblclick 才能正常工作
    let dragging = false, grabDX = 0, grabDY = 0, pendingMove = null, moveRaf = 0;
    function pushMove() {
      if (moveRaf || !pendingMove || !window.hehe) return;
      moveRaf = requestAnimationFrame(() => {
        moveRaf = 0;
        if (pendingMove && window.hehe) hehe.invoke('win:ruler:move', pendingMove[0], pendingMove[1]).catch(() => {});
      });
    }
    window.addEventListener('mousedown', (e) => {
      if (e.target && e.target.closest && e.target.closest('#ctrl')) return;
      dragging = true;
      grabDX = e.screenX - window.screenX;
      grabDY = e.screenY - window.screenY;
    });
    window.addEventListener('mousemove', (e) => {
      if (dragging) {
        pendingMove = [e.screenX - grabDX, e.screenY - grabDY];
        pushMove();
      }
      const v = dir === 'h' ? e.screenX - window.screenX : e.screenY - window.screenY;
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = Math.max(2, e.clientY - 22) + 'px';
      tip.textContent = v + ' px';
    });
    window.addEventListener('mouseup', () => { dragging = false; pendingMove = null; });
    // 指针甩出窗口/失焦时复位，避免拖拽状态卡死
    document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) { tip.style.display = 'none'; dragging = false; pendingMove = null; } });
    window.addEventListener('blur', () => { dragging = false; pendingMove = null; });
    window.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

    function closeRuler() {
      try { if (window.hehe) hehe.invoke('win:ruler:close').catch(() => {}); } catch (e) {}
      try { window.close(); } catch (e) {}
    }
    document.getElementById('close').addEventListener('click', closeRuler);
    document.getElementById('bar').addEventListener('dblclick', closeRuler);
    document.getElementById('toggle').addEventListener('click', async () => {
      try {
        if (window.hehe) { await hehe.invoke('win:ruler', dir === 'h' ? 'v' : 'h'); return; }
      } catch (e) {}
      closeRuler();
    });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeRuler(); });

    window.addEventListener('resize', draw);
    draw();
  </script>
</body>
</html>
