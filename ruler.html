<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    #bar { position: relative; width: 100vw; height: 100vh; -webkit-app-region: drag; cursor: move; }
    canvas { display: block; }
    #ctrl {
      position: fixed; right: 4px; bottom: 4px; display: flex; gap: 4px; -webkit-app-region: no-drag;
    }
    #ctrl div {
      width: 18px; height: 18px; border-radius: 4px; background: rgba(22,93,255,0.85); color: #fff;
      font-size: 11px; line-height: 18px; text-align: center; cursor: pointer; font-family: sans-serif;
    }
    #tip { position: fixed; background: rgba(22,93,255,0.9); color: #fff; font: 11px Consolas, monospace; padding: 1px 6px; border-radius: 3px; pointer-events: none; display: none; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="bar"><canvas id="c"></canvas></div>
  <div id="ctrl"><div id="toggle" title="横竖切换">⇄</div><div id="close" title="关闭(或双击标尺)">✕</div></div>
  <div id="tip"></div>
  <script>
    const params = new URLSearchParams(location.search);
    let dir = params.get('dir') === 'v' ? 'v' : 'h';
    const canvas = document.getElementById('c');
    const tip = document.getElementById('tip');
    const { ipcRenderer } = require('electron');
    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      // translucent track
      ctx.fillStyle = 'rgba(15,23,42,0.82)';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '10px Consolas, monospace';
      ctx.lineWidth = 1;
      const major = 100, mid = 50, minor = 10;
      if (dir === 'h') {
        ctx.beginPath(); ctx.moveTo(0, h - 6); ctx.lineTo(w, h - 6); ctx.stroke();
        for (let x = 0; x <= w; x += minor) {
          const len = x % major === 0 ? 14 : x % mid === 0 ? 9 : 5;
          ctx.beginPath(); ctx.moveTo(x, h - 6); ctx.lineTo(x, h - 6 - len); ctx.stroke();
          if (x % major === 0 && x > 0) ctx.fillText(String(x), x + 2, h - 22);
        }
      } else {
        ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(6, h); ctx.stroke();
        for (let y = 0; y <= h; y += minor) {
          const len = y % major === 0 ? 14 : y % mid === 0 ? 9 : 5;
          ctx.beginPath(); ctx.moveTo(6, y); ctx.lineTo(6 + len, y); ctx.stroke();
          if (y % major === 0 && y > 0) {
            ctx.save(); ctx.translate(16, y - 2); ctx.rotate(-Math.PI / 2);
            ctx.fillText(String(y), 0, 8); ctx.restore();
          }
        }
      }
    }
    window.addEventListener('resize', draw);
    draw();
    // measure mouse distance from bar origin
    window.addEventListener('mousemove', (e) => {
      const v = dir === 'h' ? e.screenX - window.screenX : e.screenY - window.screenY;
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 10) + 'px';
      tip.style.top = (e.clientY - 22) + 'px';
      tip.textContent = v + ' px';
    });
    window.addEventListener('mouseleave', () => tip.style.display = 'none');
    document.getElementById('close').addEventListener('click', () => window.close());
    document.getElementById('toggle').addEventListener('click', () => {
      ipcRenderer.invoke('win:ruler', dir === 'h' ? 'v' : 'h');
      window.close();
    });
    window.addEventListener('dblclick', () => window.close());
  </script>
</body>
</html>
