<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' https: http: blob:; media-src 'self' blob: file:">
  <title>核核工具箱</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="assets/icon32.png">
</head>
<body>
  <!-- 第三方库（本地离线加载） -->
  <script src="node_modules/jsqr/dist/jsQR.js"></script>
  <script src="node_modules/marked/marked.min.js"></script>
  <script src="node_modules/dompurify/dist/purify.min.js"></script>
  <script src="node_modules/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="node_modules/pdfjs-dist/build/pdf.min.js"></script>
  <script src="node_modules/opencc-js/dist/umd/full.js"></script>
  <script src="node_modules/tesseract.js/dist/tesseract.min.js"></script>

  <!-- 应用核心 -->
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/job-prefixes.js"></script>
  <!-- lib/fail-text.js 是主进程与渲染层共用的纯逻辑（UMD 写法：node 走
       module.exports，浏览器挂 window.FailText）。渲染层在 contextIsolation
       下无法 require lib/，所以用 <script> 直接引入同一份文件，
       避免再写一份副本、也避免「测试测副本」造成的假绿。
       必须排在引用它的 js/tools/file-tools.js 之前。 -->
  <script src="lib/fail-text.js"></script>
  <!-- lib/exif.js 同样是主进程/渲染层共用（UMD：node 走 module.exports，
       浏览器挂 window.ExifLib）。EXIF 解析原本内联在 exif-view 工具里，
       「按拍摄时间批量重命名」需要同一套解析，复制一份必然分叉，
       所以抽成 lib 并在此引入。必须排在 js/tools/*.js 之前。 -->
  <script src="lib/exif.js"></script>
  <!-- lib/pinyin.js：搜索的拼音首字母支持（打 yssc 找到「压缩」）。
       UMD 同上，挂到 window.Pinyin。零依赖 —— 用 Intl.Collator('zh-CN')
       的拼音排序做区间判定，不背拼音数据表。
       必须排在 js/registry.js 之前：它在定义时就会读 window.Pinyin。 -->
  <script src="lib/pinyin.js"></script>
  <!-- lib/ocr-guard.js：OCR 的超时与失败归因（UMD 同上，挂到 window.OcrGuard）。
       两个 OCR 工具共用 —— tesseract.js 的 recognize 在 wasm 被拦/语言包下载
       卡住时**永不 settle**，界面会永久停在「初始化 OCR 引擎…」。
       写两份必然分叉，所以收成一份；主进程测试也能 require 它验归因逻辑。
       必须排在 js/tools/media/*.js 之前。 -->
  <script src="lib/ocr-guard.js"></script>
  <!-- lib/csv-table.js：CSV 表头 → 对象数组的组装（UMD 同上，挂 window.CsvTable）。
       抽出来是为了修一个静默丢列的缺陷：表头里有 `__proto__` 时，
       `o[表头] = 值` 改的是原型而不是加属性，那一列整个消失。
       必须排在 js/tools/text-tools.js 之前（那个工具在 fire() 里就要用它）。 -->
  <script src="lib/csv-table.js"></script>
  <!-- lib/net-error.js：网络失败中文归因（UMD 同上，挂 window.NetError）。
       为什么需要它：fetch 失败时 e.message 恒为 "fetch failed"（实测），
       DNS 错、端口没开、超时三种情况的原文**完全一样** ——
       中文界面里冒出一句英文，用户既不知道原因也不知道下一步做什么。 -->
  <script src="lib/net-error.js"></script>
  <!-- IPC 通道名常量表：工具文件在定义时就会引用 window.Channels，
       所以必须排在 ui.js / registry.js / 各 tools/*.js 之前 -->
  <script src="js/channels.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/registry.js"></script>
  <!-- 工具页文案的双语表（任务 4）：工具文件里用 TT('域', '中文原文') 取词。
       必须在各 js/tools/*.js 之前加载 —— 它们定义时就引用全局 TT。
       中文模式下 TT 直接返回字面量、不查表，所以「中文零行为改动」
       是结构上保证的；英文表漏翻时回退中文，不会出现空白或键名。 -->
  <script src="js/tools/i18n.js"></script>

  <!-- 工具模块 -->
  <script src="js/tools/text-codec.js"></script>
  <script src="js/tools/mojibake-fix.js"></script>
  <script src="js/tools/text-tools.js"></script>
  <script src="js/tools/convert.js"></script>
  <script src="js/tools/json-regex.js"></script>
  <script src="js/tools/hash.js"></script>
  <script src="js/tools/file-tools.js"></script>
  <script src="js/tools/file-unlock.js"></script>
  <script src="js/tools/acl-repair.js"></script>
  <script src="js/tools/link-doctor.js"></script>
  <script src="js/tools/dir-move.js"></script>
  <script src="js/tools/security.js"></script>
  <script src="js/tools/dev.js"></script>
  <script src="js/tools/diff3.js"></script>
  <script src="js/tools/net-tools.js"></script>
  <script src="js/tools/lan-scan.js"></script>
  <script src="js/tools/sys-tools.js"></script>
  <script src="js/tools/disk-health.js"></script>
  <script src="js/tools/qr.js"></script>
  <!-- 多媒体工具（任务 9 从 media.js 拆成 17 个文件）。
       shared.js **必须排第一个**：其余文件在定义 IIFE 那一刻就会解构
       window.MediaShared。顺序由 scripts/test-media-split.js 校验。 -->
  <script src="js/tools/media/shared.js"></script>
  <script src="js/tools/media/img-batch.js"></script>
  <script src="js/tools/media/img-watermark.js"></script>
  <script src="js/tools/media/img-stitch.js"></script>
  <script src="js/tools/media/img-compress.js"></script>
  <script src="js/tools/media/img-dedup.js"></script>
  <script src="js/tools/media/img-scramble.js"></script>
  <script src="js/tools/media/exif-view.js"></script>
  <script src="js/tools/media/screenshot-ocr.js"></script>
  <script src="js/tools/media/batch-ocr.js"></script>
  <script src="js/tools/media/snip-tool.js"></script>
  <script src="js/tools/media/screen-rec.js"></script>
  <script src="js/tools/media/ffmpeg-setup.js"></script>
  <script src="js/tools/media/av-info.js"></script>
  <script src="js/tools/media/av-convert.js"></script>
  <script src="js/tools/media/video-press.js"></script>
  <script src="js/tools/media/video-trim.js"></script>
  <script src="js/tools/media/video-frames.js"></script>
  <script src="js/tools/media/audio-cut.js"></script>
  <script src="js/tools/target-size.js"></script>
  <script src="js/tools/office.js"></script>
  <script src="js/tools/launch.js"></script>
  <script src="js/tools/life.js"></script>

  <!-- 外壳（最后加载） -->
  <script src="js/app.js"></script>
</body>
</html>
