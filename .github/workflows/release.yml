name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 45 的依赖要求 Node >= 22.12
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron 45 的 package.json 没有 postinstall 钩子（33 有），
      # npm ci 之后 dist/ 是空的。不补这一步，electron-builder 打包会立刻失败。
      - name: Ensure electron binary is downloaded
        shell: bash
        run: |
          set -e
          if [ -f node_modules/electron/dist/electron.exe ]; then
            echo "electron binary already present"
          else
            echo "electron binary missing, running install.js"
            node node_modules/electron/install.js
          fi
          test -f node_modules/electron/dist/electron.exe
          echo "electron.exe OK"

      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in main.js preload.js lib/*.js js/*.js js/tools/*.js scripts/*.js; do node --check "$f"; done
          echo "syntax OK"

      # 版本号规则：每段只能是 0–9，满 10 进位（0.0.14 是错的，应写 0.1.4）。
      # 放在构建之前，避免打出一个版本号不合规的包。
      - name: Verify version format
        run: npm run version:check

      # tag 必须与 package.json 版本一致，否则发布出去的文件名和 tag 对不上，
      # 用户按 tag 找包会 404（历史上踩过）。
      - name: Tag matches package.json version
        shell: bash
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            PKG=$(node -p "require('./package.json').version")
            echo "tag=$TAG package=$PKG"
            if [[ "$TAG" != "$PKG" ]]; then
              echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致"
              exit 1
            fi
          else
            echo "非 tag 触发，跳过一致性检查"
          fi

      - name: Run tests
        run: npm test

      - name: Build portable exe + zip
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 产物必须先存在再交给上传步骤：之前 upload 步骤报错时，
      # 由于 release 已创建，界面显示「Assets 2」但其实只挂上了源码包，很难察觉。
      - name: Verify artifacts exist
        shell: bash
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          node -e "
            const fs=require('fs');
            const ver=process.argv[1];
            const want=['dist/hehe-toolbox-Portable-'+ver+'.exe','dist/hehe-toolbox-'+ver+'-win-x64.zip'];
            let bad=false;
            for(const f of want){
              if(!fs.existsSync(f)){ console.error('::error::构建产物缺失：'+f); bad=true; continue; }
              const st=fs.statSync(f);
              if(st.size < 10*1024*1024){ console.error('::error::产物异常小('+st.size+'B)：'+f); bad=true; continue; }
              if(/[^\x00-\x7F]/.test(f)){ console.error('::error::产物名含非 ASCII 字符：'+f); bad=true; continue; }
              console.log('OK '+f+' ('+st.size+' bytes)');
            }
            process.exit(bad?1:0);
          " "$VER"

      # 直接发布（不是草稿）：草稿需要凭据才能点「Publish」，
      # 而本机 CI 之外没有 GitHub 凭据，草稿会一直停在那里、资产对用户不可见。
      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: 核核工具箱 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/hehe-toolbox-Portable-*.exe
            dist/hehe-toolbox-*-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 兜底：把 Release 标题钉死成「核核工具箱 vX.Y.Z」。
      # 实测 v0.2.1 发布后 name 变成了 "0.2.1"（只是 tag 去掉前缀），
      # action 的 name 输入没有按预期生效。这里不依赖 action 的行为，
      # 发布完直接用 API 改写一次，保证与既有 6 个 Release 命名一致。
      - name: Normalize release title
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          WANT="核核工具箱 $TAG"
          REPO="${{ github.repository }}"
          echo "want title: $WANT"
          # 等 Release 就绪（action 刚创建，可能有短暂延迟）
          for i in $(seq 1 10); do
            GOT=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).name||'')}catch(e){console.log('')}})")
            if [ "$GOT" = "$WANT" ]; then
              echo "title already correct"
              exit 0
            fi
            echo "attempt $i: current name = '$GOT'"
            curl -sf -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
              -d "{\"name\":\"$WANT\"}" > /dev/null && echo "patched"
            sleep 2
          done
          GOT=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).name||'')}catch(e){console.log('')}})")
          if [ "$GOT" = "$WANT" ]; then echo "OK title = $GOT"; else echo "::error::标题未统一，实际 '$GOT'，期望 '$WANT'"; exit 1; fi
