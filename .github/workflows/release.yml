name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 45 的依赖要求 Node >= 22.12
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron 45 的 package.json 没有 postinstall 钩子（33 有），
      # npm ci 之后 dist/ 是空的。不补这一步，electron-builder 打包会立刻失败。
      - name: Ensure electron binary is downloaded
        shell: bash
        run: |
          set -e
          if [ -f node_modules/electron/dist/electron.exe ]; then
            echo "electron binary already present"
          else
            echo "electron binary missing, running install.js"
            node node_modules/electron/install.js
          fi
          test -f node_modules/electron/dist/electron.exe
          echo "electron.exe OK"

      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in main.js preload.js lib/*.js js/*.js js/tools/*.js scripts/*.js; do node --check "$f"; done
          echo "syntax OK"

      # 版本号规则：每段只能是 0–9，满 10 进位（0.0.14 是错的，应写 0.1.4）。
      # 放在构建之前，避免打出一个版本号不合规的包。
      - name: Verify version format
        run: npm run version:check

      # tag 必须与 package.json 版本一致，否则发布出去的文件名和 tag 对不上，
      # 用户按 tag 找包会 404（历史上踩过）。
      - name: Tag matches package.json version
        shell: bash
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            PKG=$(node -p "require('./package.json').version")
            echo "tag=$TAG package=$PKG"
            if [[ "$TAG" != "$PKG" ]]; then
              echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致"
              exit 1
            fi
          else
            echo "非 tag 触发，跳过一致性检查"
          fi

      - name: Run tests
        run: npm test

      - name: Build portable exe + zip
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 【产物必须校验内容，不只是存在与大小】
      # verify-dist-round3/4 是两份「把源码断言跑在 asar 里」的校验脚本 ——
      # 它们检查的是**打包进去的东西**，与源码层测试互补：源码测试全绿但打包
      # 漏了文件、或文件被旧版本覆盖，只有这里能发现。
      # 这两份脚本以前从没接进任何自动化流程（写完就再没被运行过），
      # 所以断言过期了也没人知道（实测 round3 有 2 条、round4 有 4 条
      # 因模块搬迁而永久假红）。接进来之后它们会跟着每次发版被检验。
      - name: Verify packaged artifact contents
        shell: bash
        run: node scripts/verify-dist-round3.js

      - name: Verify packaged artifact contents (round 4)
        shell: bash
        run: node scripts/verify-dist-round4.js

      # 产物必须先存在再交给上传步骤：之前 upload 步骤报错时，
      # 由于 release 已创建，界面显示「Assets 2」但其实只挂上了源码包，很难察觉。
      - name: Verify artifacts exist
        shell: bash
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          node -e "
            const fs=require('fs');
            const ver=process.argv[1];
            const want=['dist/hehe-toolbox-Portable-'+ver+'.exe','dist/hehe-toolbox-'+ver+'-win-x64.zip'];
            let bad=false;
            for(const f of want){
              if(!fs.existsSync(f)){ console.error('::error::构建产物缺失：'+f); bad=true; continue; }
              const st=fs.statSync(f);
              if(st.size < 10*1024*1024){ console.error('::error::产物异常小('+st.size+'B)：'+f); bad=true; continue; }
              if(/[^\x00-\x7F]/.test(f)){ console.error('::error::产物名含非 ASCII 字符：'+f); bad=true; continue; }
              console.log('OK '+f+' ('+st.size+' bytes)');
            }
            process.exit(bad?1:0);
          " "$VER"

      # 直接发布（不是草稿）：草稿需要凭据才能点「Publish」，
      # 而本机 CI 之外没有 GitHub 凭据，草稿会一直停在那里、资产对用户不可见。
      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: 核核工具箱 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/hehe-toolbox-Portable-*.exe
            dist/hehe-toolbox-*-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 兜底：把 Release 标题钉死成「核核工具箱 vX.Y.Z」。
      # 实测 v0.2.1 / v0.2.6 发布后 name 变成了去掉 v 前缀的 tag（"0.2.1" / "0.2.6"），
      # action 的 name 输入没有按预期生效。这里不依赖 action 的行为，
      # 发布完直接回读并改写，保证与既有 Release 命名一致。
      #
      # 为什么不再用 curl：v0.2.6 这一步挂红就是 curl 造成的。
      # `curl -d` 默认 Content-Type 是 application/x-www-form-urlencoded，
      # GitHub 按表单解析 JSON 体拿不到 name，返回 200 但标题不变，
      # 循环跑完后判定失败——而包其实早就发布成功了，白挂一个红灯。
      # 改成 scripts/fix-release-title.js：显式 application/json、
      # 每次改完都回读校验、标题已正确时不发 PATCH（可重复跑）。
      - name: Normalize release title
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          node scripts/fix-release-title.js "$TAG"

      # 兜底：确保 Release 正文非空。
      #
      # 【为什么需要这一步】
      # 上面 action-gh-release 配了 generate_release_notes: true，但实测
      # **v0.3.7 的正文是 null**，v0.3.6/v0.3.5/v0.2.8 都有（3386/1714/1380 字符）。
      # 已排除：配置没改过（git diff 空）、权限够（contents: write）、
      # 两步都 success、fix-release-title.js 不碰 body。
      # 上游有同类 issue（softprops/action-gh-release#191），属 action 行为不稳定。
      #
      # 所以不把「有正文」寄托在第三方 action 的一个布尔参数上：
      # 这里自己检查一次，为空就用 GitHub 的 generate-notes API 补上。
      # 已有正文时幂等退出，不会覆盖 action 生成的内容。
      #
      # 【这一步刻意不挂红】资产已上传、用户能下载；正文缺失是「说明不完整」，
      # 不是「发布失败」。生成不出来时打一行 WARN 让人看见即可。
      # （对比：标题归一化那步失败必须挂红 —— 标题与 tag 对不上会让用户按 tag
      #  找包时对不上，那是真问题。）
      - name: Ensure release notes are not empty
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/ensure-release-notes.js "$TAG"
