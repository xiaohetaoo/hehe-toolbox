name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all sources
        shell: bash
        run: |
          set -e
          for f in main.js preload.js js/*.js js/tools/*.js; do node --check "$f"; done
          echo "syntax OK"

      - name: Verify tool registration count
        shell: pwsh
        run: |
          $n = (Select-String -Path js/tools/*.js -Pattern "register\(\{" -AllMatches | Measure-Object).Count
          Write-Host "registered tools: $n"
          if ($n -lt 90) { throw "tool count regressed: $n" }

      - name: Pure-function regression tests
        run: npm test
