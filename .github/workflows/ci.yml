name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 45 的依赖要求 Node >= 22.12（33 是 Node 20）。
          # 用 20 会一堆 EBADENGINE，且 @electron/get 行为不可靠。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron 45 的 package.json **没有 postinstall 钩子**（33 有），
      # 所以 npm ci 之后 node_modules/electron/dist/ 是空的、path.txt 也不存在。
      # 打包和冒烟都要用到里面的 electron.exe，必须显式补跑一次下载。
      - name: Ensure electron binary is downloaded
        shell: bash
        run: |
          set -e
          if [ -f node_modules/electron/dist/electron.exe ]; then
            echo "electron binary already present"
          else
            echo "electron binary missing, running install.js"
            node node_modules/electron/install.js
          fi
          test -f node_modules/electron/dist/electron.exe
          echo "electron.exe OK"

      - name: Syntax check all sources
        shell: bash
        run: |
          set -e
          for f in main.js preload.js lib/*.js js/*.js js/tools/*.js scripts/*.js; do node --check "$f"; done
          echo "syntax OK"

      # 版本号规则：每段 0–9，满 10 进位（0.0.14 不合规，应写 0.1.4）
      - name: Verify version format
        run: npm run version:check

      - name: Verify tool registration count
        shell: pwsh
        run: |
          $n = (Select-String -Path js/tools/*.js -Pattern "register\(\{" -AllMatches | Measure-Object).Count
          Write-Host "registered tools: $n"
          if ($n -lt 90) { throw "tool count regressed: $n" }

      - name: Pure-function regression tests
        shell: bash
        run: |
          # 逐个跑每个测试并记录退出码。npm test 用 && 串联，
          # 中间任一步非零都会中断整串，而 GitHub 只会把整步标成 failure，
          # 日志里看不出到底哪个脚本挂了 —— 已经因此排查了好几轮。
          # 这里显式循环：把失败脚本名和末尾输出直接打到日志里。
          set +e
          node -e "require('./package.json').scripts.test.split('&&').map(s=>s.trim()).filter(Boolean).forEach(s=>console.log(s))" > /tmp/steps.txt
          I=0
          FAILED=""
          while IFS= read -r C; do
            [ -z "$C" ] && continue
            I=$((I + 1))
            echo "----- [$I] $C"
            OUT=$($C 2>&1)
            RC=$?
            echo "$OUT" | tail -8
            if [ $RC -ne 0 ]; then
              FAILED="$C (exit $RC)"
              echo "::::: STEP FAILED: $C"
              # 失败脚本的**完整**输出，不只是末尾 8 行。
              echo "::::: FULL OUTPUT BEGIN"
              echo "$OUT"
              echo "::::: FULL OUTPUT END"
              # 日志要登录才能看，但annotation 是公开可读的。
              # 把失败断言行塞进 annotation（每行单独一条，避免被截断）。
              echo "$OUT" | grep -E '^(FAIL|SKIP) ' | head -12 | while IFS= read -r L; do
                echo "::error title=$C::$(echo "$L" | sed 's/%/%25/g' | sed 's/\r//g')"
              done
              break
            fi
          done < /tmp/steps.txt
          if [ -n "$FAILED" ]; then
            echo "::error::测试失败：$FAILED"
            # 同时写进 Step Summary —— 日志需要登录才能看，
            # 但 summary 是公开可读的页面，排查时能直接看到失败原因。
            {
              echo "### 测试失败"
              echo ""
              echo '```'
              echo "脚本：$FAILED"
              echo ''
              echo "$OUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "全部测试步骤通过（共 $I 步）"

      # 冒烟测试：真的把 Electron 跑起来，确认 93 个工具页全部能渲染。
      # 这是唯一能抓住「IPC handler 重复注册导致应用启动即卡死」这类
      # node --check 与单元测试都看不见的故障的手段（第五轮真踩过）。
      # Windows runner 有交互式桌面会话，无需 xvfb。
      - name: Smoke test (boot app, render all tool pages)
        shell: bash
        env:
          HEHE_SMOKE: '1'
          HEHE_NOSPLASH: '1'
          HEHE_TEST_DATA: ${{ runner.temp }}\hehe-smoke-data
        run: |
          set -e
          mkdir -p "$HEHE_TEST_DATA"
          # 关键：ELECTRON_RUN_AS_NODE 一旦存在于环境中（哪怕为空串以外的任何值），
          # Electron 会退化成纯 Node 跑 main.js —— 表现为
          #   TypeError: Cannot read properties of undefined (reading 'handle')
          # 因为 ipcMain 只有 Electron 主进程才提供。必须 unset 而不是赋空。
          unset ELECTRON_RUN_AS_NODE
          echo "ELECTRON_RUN_AS_NODE='${ELECTRON_RUN_AS_NODE-<unset>}'"
          # 冒烟模式由 main.js 内置：渲染全部工具页 → 打印 SMOKE_RESULT → 自行退出
          timeout 240 node_modules/electron/dist/electron.exe . > smoke.log 2>&1 || true
          echo "---- smoke.log ----"
          cat smoke.log
          if grep -q "SMOKE_RESULT:.*PASS" smoke.log; then
            echo "smoke PASS"
          else
            echo "::error::冒烟测试未通过（未出现 SMOKE_RESULT ... PASS）"
            exit 1
          fi
