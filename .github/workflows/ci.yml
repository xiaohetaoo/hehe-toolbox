name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 45 的依赖要求 Node >= 22.12（33 是 Node 20）。
          # 用 20 会一堆 EBADENGINE，且 @electron/get 行为不可靠。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron 45 的 package.json **没有 postinstall 钩子**（33 有），
      # 所以 npm ci 之后 node_modules/electron/dist/ 是空的、path.txt 也不存在。
      # 打包和冒烟都要用到里面的 electron.exe，必须显式补跑一次下载。
      - name: Ensure electron binary is downloaded
        shell: bash
        run: |
          set -e
          if [ -f node_modules/electron/dist/electron.exe ]; then
            echo "electron binary already present"
          else
            echo "electron binary missing, running install.js"
            node node_modules/electron/install.js
          fi
          test -f node_modules/electron/dist/electron.exe
          echo "electron.exe OK"

      - name: Syntax check all sources
        shell: bash
        run: |
          set -e
          for f in main.js preload.js lib/*.js ipc/*.js js/*.js js/tools/*.js scripts/*.js; do node --check "$f"; done
          echo "syntax OK"

      # ESLint 静态检查：抓 node --check 抓不到的「写成了但引用错」。
      # 历史证据（都是语法检查与单元测试都看不见的真 bug）：
      #   · js/app.js 的 finally 引用 try 块内 let dlId（no-undef）
      #   · js/tools/life.js 的 countIn 创建后从未被读取（no-unused-vars）
      #   · js/tools/launch.js 的 pickOne 跨作用域引用（no-undef，导致命令收藏页点添加无反应）
      #   · js/tools/media.js 的 parseTiff 引用 parseExif 的形参 buf（no-undef，带 EXIF 的照片反而报错）
      # 存量问题已用行级压制登记在 scripts/lint-baseline.md，
      # 所以这一步的退出码必须是 0；哪天它红了，说明**新增**了问题（那正是要拦的）。
      - name: Lint (ESLint)
        run: npm run lint

      # 【类型检查：ESLint 看不见的那一半】
      # 本项目没有类型系统，但 jsconfig.json 开了 checkJs，用 tsc 对 lib/ 与
      # ipc/ 做纯推导式检查（noEmit，不改任何产物）。它抓的是 ESLint 结构上
      # 抓不到的一类问题：函数收一个参数、JSDoc 里声明了某个字段、代码里却
      # 从没传/没写。首次接入时报出 95 条，其中真问题是：
      #   · lib/dir-move.js 的 validateMove 读 x.srcExists，JSDoc 里根本没声明；
      #   · lib/disk-health.js 的 @returns 写着 totals，实际代码里没有这个字段；
      #   · lib/acl-repair.js 的 diagnose 两条返回路径字段不一致（一条少
      #     repairPossible，调用方会拿到 undefined）。
      # 现在基线是 0 错误，所以这一步退出码必须是 0；哪天红了就是新增问题。
      - name: Type check (jsconfig + checkJs)
        run: npm run typecheck

      # 版本号规则：每段 0–9，满 10 进位（0.0.14 不合规，应写 0.1.4）
      - name: Verify version format
        run: npm run version:check

      # 工具数统计：必须**递归**子目录。
      # 任务 9 把 media.js 拆成了 js/tools/media/*.js（16 个工具进子目录），
      # 原来的 `-Path js/tools/*.js` 只匹配顶层文件，会数成 84 个 ——
      # 于是下面 `< 90` 那条判断直接 throw，CI 报「tool count regressed: 84」，
      # 而实际一个工具都没少。Select-String 的 -Path 不展开通配符递归，
      # 这里改用 Get-ChildItem -Recurse 显式给文件列表。
      - name: Verify tool registration count
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path js/tools -Filter *.js -Recurse -File
          $n = ($files | Select-String -Pattern "register\(\{" -AllMatches | Measure-Object).Count
          Write-Host "registered tools: $n  (in $($files.Count) files)"
          if ($n -lt 90) { throw "tool count regressed: $n" }

      - name: Pure-function regression tests
        shell: bash
        run: |
          # 逐个跑每个测试并记录退出码。npm test 用 && 串联，
          # 中间任一步非零都会中断整串，而 GitHub 只会把整步标成 failure，
          # 日志里看不出到底哪个脚本挂了 —— 已经因此排查了好几轮。
          # 这里显式循环：把失败脚本名和末尾输出直接打到日志里。
          set +e
          # 【任务 8 之后 test 不再是单条长链】
          # 它现在是 `npm run test:unit && npm run test:ui`，
          # 直接按 && 拆会得到两条 npm run —— 失败定位粒度就退化成一个整步了。
          # 所以这里把 test:unit / test:ui 两条脚本各自再拆开，合并成扁平清单，
          # 保持「一行一个 node 脚本」的定位能力。
          node -e "
            const p = require('./package.json');
            const flat = (name, depth) => {
              const body = p.scripts[name];
              if (typeof body !== 'string' || depth > 3) return [];
              return body.split('&&').map(s => s.trim()).filter(Boolean)
                .flatMap(piece => {
                  const m = piece.match(/^npm\s+run\s+([^\s]+)\$/);
                  return m ? flat(m[1], depth + 1) : [piece];
                });
            };
            flat('test', 0).forEach(s => console.log(s));
          " > /tmp/steps.txt
          echo "要执行的测试步数：$(( $(wc -l < /tmp/steps.txt) ))"
          I=0
          FAILED=""
          while IFS= read -r C; do
            [ -z "$C" ] && continue
            I=$((I + 1))
            echo "----- [$I] $C"
            OUT=$($C 2>&1)
            RC=$?
            echo "$OUT" | tail -8
            if [ $RC -ne 0 ]; then
              FAILED="$C (exit $RC)"
              echo "::::: STEP FAILED: $C"
              # 失败脚本的**完整**输出，不只是末尾 8 行。
              echo "::::: FULL OUTPUT BEGIN"
              echo "$OUT"
              echo "::::: FULL OUTPUT END"
              # 日志要登录才能看，但annotation 是公开可读的。
              # 把失败断言行塞进 annotation（每行单独一条，避免被截断）。
              echo "$OUT" | grep -E '^(FAIL|SKIP) ' | head -12 | while IFS= read -r L; do
                echo "::error title=$C::$(echo "$L" | sed 's/%/%25/g' | sed 's/\r//g')"
              done
              break
            fi
          done < /tmp/steps.txt
          if [ -n "$FAILED" ]; then
            echo "::error::测试失败：$FAILED"
            # 同时写进 Step Summary —— 日志需要登录才能看，
            # 但 summary 是公开可读的页面，排查时能直接看到失败原因。
            {
              echo "### 测试失败"
              echo ""
              echo '```'
              echo "脚本：$FAILED"
              echo ''
              echo "$OUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "全部测试步骤通过（共 $I 步）"

      # 【断言总数护栏：防止「悄悄变少」】
      # 前面每一步都只看「通过的算通过、失败的算失败」——
      # 但如果在某个测试文件里删掉 50 条用例，剩下的仍然全绿，CI 不会报警。
      # 这个坑真踩过：test-store-health.js 被自动清理脚本从 81 行删到 25 行，
      # 86 条断言变成十几条，而 npm test 依然 PASS。
      # 这里把整套测试再数一遍，与 scripts/assertions-baseline.json 比对：
      # 任何文件的 PASS 条数比基线少就 FAIL，并列出少了多少条。
      # 有意删除必须显式重拍基线（那一步会出现在 diff 里，评审看得见）。
      - name: Assertion count guard (no silent test deletion)
        shell: bash
        run: |
          set -e
          node scripts/check-assertion-count.js
          echo "断言数守卫通过（没有文件比基线少）"

      # 冒烟测试：真的把 Electron 跑起来，确认 93 个工具页全部能渲染。
      # 这是唯一能抓住「IPC handler 重复注册导致应用启动即卡死」这类
      # node --check 与单元测试都看不见的故障的手段（第五轮真踩过）。
      # Windows runner 有交互式桌面会话，无需 xvfb。
      - name: Smoke test (boot app, render all tool pages)
        shell: bash
        env:
          HEHE_SMOKE: '1'
          HEHE_NOSPLASH: '1'
          HEHE_TEST_DATA: ${{ runner.temp }}\hehe-smoke-data
        run: |
          set -e
          mkdir -p "$HEHE_TEST_DATA"
          # 关键：ELECTRON_RUN_AS_NODE 一旦存在于环境中（哪怕为空串以外的任何值），
          # Electron 会退化成纯 Node 跑 main.js —— 表现为
          #   TypeError: Cannot read properties of undefined (reading 'handle')
          # 因为 ipcMain 只有 Electron 主进程才提供。必须 unset 而不是赋空。
          unset ELECTRON_RUN_AS_NODE
          echo "ELECTRON_RUN_AS_NODE='${ELECTRON_RUN_AS_NODE-<unset>}'"
          # 冒烟模式由 main.js 内置：渲染全部工具页 → 打印 SMOKE_RESULT → 自行退出
          timeout 240 node_modules/electron/dist/electron.exe . > smoke.log 2>&1 || true
          echo "---- smoke.log ----"
          cat smoke.log
          if grep -q "SMOKE_RESULT:.*PASS" smoke.log; then
            echo "smoke PASS"
          else
            echo "::error::冒烟测试未通过（未出现 SMOKE_RESULT ... PASS）"
            exit 1
          fi
